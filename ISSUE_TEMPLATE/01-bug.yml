name: Bug Report
# Reports a defect in existing behavior.
description: Report a problem with existing behavior.
type: bug
body:
  - type: dropdown
    id: scope
    attributes:
      label: Repository / Scope
      description: Select the affected repositories, or General for organization-wide work.
      multiple: true
      options:
        - calculator-comrade
        - calculator-comrade-lib
        - calculator-comrade-android-tests
        - General / cross-repository
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the problem?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open ...
        2. Perform ...
        3. Observe ...
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant app version, OS, device, browser/WebView, or build details.
      placeholder: |
        App version / commit:
        Platform / OS:
        Device / browser:
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Logs, screenshots, related issues, or other useful details.
    validations:
      required: false
